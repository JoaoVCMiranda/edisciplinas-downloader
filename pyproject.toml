[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edisciplinas-downloader"
dynamic = ["version"]
description = "Baixa os materiais das suas disciplinas do e-Disciplinas (Moodle da USP)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "João Victor Cavalcante Miranda", email = "joaovictorcmiranda@usp.br" }]
keywords = ["usp", "moodle", "e-disciplinas", "downloader"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/JoaoVCMiranda/edisciplinas-downloader"
Issues = "https://github.com/JoaoVCMiranda/edisciplinas-downloader/issues"

[project.scripts]
edisc = "edisc.cli:main"

[tool.setuptools]
packages = ["edisc"]

[tool.setuptools.dynamic]
version = { attr = "edisc.__version__" }
